services:
  pocket-id-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://pocket-id:1411
    restart: unless-stopped

  mcp-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://mcp:8080
    restart: unless-stopped

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    environment:
      APP_URL: ${POCKET_ID_URL}
      ENCRYPTION_KEY: replace-me-in-production
      TRUSTED_PLATFORM: CF-Connecting-IP
      UI_CONFIG_DISABLED: true
      CIMD_URL_ALLOWLIST: ${CIMD_URL_ALLOWLIST}
    volumes:
      - pocket-id-data:/app/data

  mcp:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      MCP_RESOURCE_URL: ${MCP_URL:-http://localhost:8080/mcp}
      OAUTH_ISSUER_URL: ${POCKET_ID_URL:-http://localhost:1411}
      OAUTH_JWKS_URL: http://pocket-id:1411/.well-known/jwks.json

volumes:
  pocket-id-data:
